# =====================================================
# Configuration Mosquitto MQTT Broker
# =====================================================

# --- Persistance ---
persistence true
persistence_location /mosquitto/data/

# --- Logs ---
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# --- Listener MQTT (TCP) ---
listener 1883
protocol mqtt

# --- Listener WebSocket ---
listener 9001
protocol websockets

# --- Authentification ---
# Connexions anonymes autorisées (mode dev). À désactiver en production.
allow_anonymous true

# Pour activer un mot de passe :
#   1. allow_anonymous false
#   2. password_file /mosquitto/config/passwd
#   3. docker exec -it mosquitto-mqtt mosquitto_passwd -c /mosquitto/config/passwd <user>
